<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>土壤溼度感測自動澆水系統</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('https://i.pinimg.com/736x/9e/b7/1e/9eb71e61e913dceb8e56dea1b5c657d7.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(10px);
        transform: scale(1.05);
        z-index: -1;
      }

      .overlay {
        background: rgba(0, 0, 0, 0.56);
        padding: 40px 32px;
        border-radius: 24px;
        max-width: 860px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2.5rem, 5vw, 4.2rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.6rem);
      }

      .student-id,
      .link {
        margin-top: 12px;
      }

      .link a {
        color: #ffd966;
        text-decoration: none;
      }

      .link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <h1>土壤溼度感測自動澆水系統</h1>
      <p>曾于庭</p>
      <p class="student-id">學號：B11213119</p>
      <p id="time">現在時間：{{ current_time|date:'Y/m/d H:i:s' }}</p>
      <p class="link"><a href="http://172.20.10.7/" target="_blank" rel="noopener">http://172.20.10.7/</a></p>
    </div>
    <script>
      const timeEl = document.getElementById('time');
      const pad = (num) => String(num).padStart(2, '0');
      function updateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = pad(now.getMonth() + 1);
        const day = pad(now.getDate());
        const hours = pad(now.getHours());
        const minutes = pad(now.getMinutes());
        const seconds = pad(now.getSeconds());
        timeEl.textContent = `現在時間：${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
      }
      updateTime();
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
