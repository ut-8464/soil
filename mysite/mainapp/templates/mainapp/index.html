<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>土壤溼度感測自動澆水系統</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #ffffff;
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnG34tZFxu-nal8-ya-tgcJb53vQFJT-aIrQ&s');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .overlay {
        background: rgba(0, 0, 0, 0.48);
        padding: 40px 32px;
        border-radius: 24px;
        max-width: 860px;
        width: 100%;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2.5rem, 5vw, 4.2rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.6rem);
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <h1>土壤溼度感測自動澆水系統</h1>
      <p>曾于庭</p>
    </div>
  </body>
</html>
